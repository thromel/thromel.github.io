    - id: ai-for-sre
      umbrella: "AI4SE · AI for SRE"
      question: "How should agents be evaluated when diagnosis and recovery happen inside live reliability conditions?"
      rationale: >-
        SREGym studies realistic failure lifecycles, safe mitigation, business-level
        recovery checks, and the evidence needed to distinguish durable recovery from a shallow fix.
      status: "Active research"
      link_label: "Visit SREGym"
