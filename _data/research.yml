  research_agenda:
    - id: long-horizon-coding-agents
      umbrella: "AI4SE · LLM4Coding"
      question: "How can long-horizon coding agents preserve context, repository memory, and architectural intent as software evolves?"
      rationale: >-
        ContextLedger turns long sessions into typed, provenance-carrying events so
        context compaction and recovery can be inspected instead of trusted by intuition.
